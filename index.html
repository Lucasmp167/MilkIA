<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MilkIQ · Leite IA</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14231c;--mu:#5d6f66;--pr:#0f7a55;--pr2:#e3f4ec;--bd:#dde6e0;--ok:#0f7a55;--wa:#b7791f;--cr:#c0392b;--na:#6b7a74;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#17221c;--tx:#e8f1ec;--mu:#97aaa0;--pr:#3ecf94;--pr2:#16342a;--bd:#25342c;--ok:#3ecf94;--wa:#e5ad4a;--cr:#ef6b5c;--na:#8fa196}}
:root[data-theme="dark"]{--bg:#0e1612;--card:#17221c;--tx:#e8f1ec;--mu:#97aaa0;--pr:#3ecf94;--pr2:#16342a;--bd:#25342c;--ok:#3ecf94;--wa:#e5ad4a;--cr:#ef6b5c;--na:#8fa196}
*{box-sizing:border-box}html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:18px 0 8px}p{margin:4px 0}
.mu{color:var(--mu);font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.tap{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:104px}
.sec .ic{font-size:24px}.sec b{font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}

.demo{background:var(--pr2);color:var(--pr);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.kpi b{font-size:18px;display:block}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}

nav button span{font-size:20px}nav button.on{color:var(--pr);font-weight:700}
nav .fab{background:var(--pr);color:#fff;border-radius:99px;padding:8px 14px;margin-top:-18px;box-shadow:0 4px 14px #0004}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.s{background:var(--pr2);color:var(--pr);width:auto;padding:6px 12px;font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.ov{overflow-x:auto}svg{width:100%;height:auto;display:block}
.banner{font-size:12px;color:var(--mu);background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:8px 10px;margin:8px 0}
ul{padding-left:18px;margin:6px 0}.res{font-weight:700;color:var(--pr)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tb{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}.tb.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.clk{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}button:disabled{opacity:.4}
@media print{nav,.noprint{display:none!important}body{background:#fff;color:#000}}
</style></head><body><div id="app"></div>
<nav id="nav"></nav>
<script>
const SECT=[
["🏡","Cadastro da fazenda","Produtor, rebanho, produção, localização e metas",["Dados do produtor e localização","Rebanho e produção diária","Metas (CCS, CBT, litros/vaca)"]],
["⚙️","Ordenhadeiras e equipamentos","Cadastro técnico, modelos GEA, componentes e peças",["Cadastro técnico por máquina","Componentes e peças","Histórico de intervenções"]],
["📏","ISO Check","Auditorias ISO 5707/6690, vácuo, pulsação",["Medições de vácuo e pulsação","Comparação entre datas","Classificação técnica"]],
["🔧","Testes técnicos","Diagnóstico mecânico, campo, leite residual, PT6",["Testes de campo","Leite residual","Comparação de relatórios PT6"]],
["🥛","Qualidade do leite","CCS, CBT, gordura, proteína, lactose, crioscopia, ureia",["Análises laboratoriais","Tendência CCS/CBT","Avaliação de tetos (IA, com confirmação do técnico)"]],
["⏱️","Otimização da ordenha","Cronômetros, preparo, acoplamento, sobreordenha, ranking",["Cronômetros por vaca","Comparação entre turnos","Ranking de ordenhadores (com ressalvas)"]],
["🧼","Limpeza CIP e químicos","Temperaturas, tempo, concentração, consumo, estoque, água",["Registros de CIP","Consumo e estoque de químicos","Análises de água"]],
["🛠️","Manutenção preventiva","Revisões, peças, histórico e alertas",["Cronograma de revisões","Peças trocadas","Alertas de vencimento"]],
["📄","Documentos e relatórios","PDFs técnicos, gráficos, fotos, assinaturas, planos de ação",["Relatórios em PDF","Fotos e assinaturas","Planos de ação"]]];
const ST={ok:"Bom",wa:"Atenção",cr:"Crítico",na:"Não avaliado"};
function series(base,amp,n,seed){const a=[];for(let i=0;i<n;i++)a.push(Math.round(base+amp*Math.sin(i*1.7+seed)+amp*.5*Math.cos(i*.9+seed*2)));return a}
let farms=[
{id:"modelo",name:"Fazenda Modelo",producer:"Produtor Fictício A",city:"Castro, PR",demo:true,cows:180,milking:160,liters:4800,hours:7.5,
 ccs:series(150,35,14,1),cbt:series(12,4,14,2),prod:series(4800,150,14,3),goalCcs:200,
 st:["ok","ok","wa","ok","ok","ok","ok","ok","ok"],
 alerts:[["wa","Revisão de pulsadores vence em 12 dias (demo)"],["ok","CCS dentro da meta nos últimos 14 dias (demo)"]],visits:[]},
{id:"critica",name:"Fazenda Crítica",producer:"Produtor Fictício B",city:"Carambeí, PR",demo:true,cows:90,milking:75,liters:1500,hours:6,
 ccs:series(780,120,14,4),cbt:series(220,60,14,5),prod:series(1500,120,14,6),goalCcs:300,
 st:["wa","cr","na","cr","cr","cr","cr","cr","wa"],
 alerts:[["cr","CCS acima da meta há 14 dias (demo)"],["cr","CIP com temperatura final abaixo do registrado como alvo (demo)"],["cr","Sobreordenha frequente no turno da tarde (demo)"],["wa","Manutenção preventiva atrasada (demo)"]],visits:[]}];
let V={v:"home",f:farms[0].id,s:0};
const $=id=>document.getElementById(id),F=()=>farms.find(x=>x.id==V.f)||farms[0];
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
function line(d,c,goal){if(!d.length)return'<p class="mu">Sem dados ainda.</p>';const W=320,H=120,mx=Math.max(...d,goal||0)*1.1,mn=Math.min(...d,goal||1e9)*.9;
const X=i=>10+i*(W-20)/(d.length-1||1),Y=v=>H-10-(v-mn)/(mx-mn||1)*(H-20);
return`<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${c}" stroke-width="2.5" points="${d.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>${goal?`<line x1="10" x2="${W-10}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="currentColor" stroke-dasharray="4" opacity=".5"/><text x="12" y="${Y(goal)-4}" font-size="9" fill="currentColor" opacity=".7">meta ${goal}</text>`:""}</svg>`}
function bars(d,c){if(!d.length)return'<p class="mu">Sem dados ainda.</p>';const W=320,H=110,mx=Math.max(...d)*1.1,w=(W-20)/d.length;return`<svg viewBox="0 0 ${W} ${H}">${d.map((v,i)=>`<rect x="${10+i*w+2}" y="${H-8-v/mx*(H-16)}" width="${w-4}" height="${v/mx*(H-16)}" rx="3" fill="${c}"/>`).join("")}</svg>`}
function head(t,sub){return`<div class="top"><div><h1>${t}</h1><div class="mu">${sub||""}</div></div></div>`}
const BANNER='<div class="banner">Prévia interativa com dados fictícios de demonstração. Ainda sem banco de dados, IA ou sincronização reais.</div>';
function kpis(f){const c=avg(f.ccs),b=avg(f.cbt),p=avg(f.prod),lv=p?(p/f.milking).toFixed(1):"—",lh=p&&f.hours?Math.round(p/(f.hours*60)*60):"—";
return`<div class="kpi"><div><span class="mu">Litros/vaca</span><b>${lv}</b></div><div><span class="mu">Litros/hora</span><b>${lh}</b></div><div><span class="mu">Produção/dia</span><b>${p||"—"}</b></div><div><span class="mu">CCS (mil/mL)</span><b class="${c==null?"":c>f.goalCcs?"cr":"ok"}">${c??"—"}</b></div><div><span class="mu">CBT (mil UFC/mL)</span><b>${b??"—"}</b></div><div><span class="mu">Vacas em lactação</span><b>${f.milking}</b></div></div>`}
function home(){return head("🥛 MilkIQ · Leite IA","Suas fazendas")+BANNER+farms.map(f=>`<div class="card tap" onclick="go('farm','${f.id}')"><div class="top"><b style="font-size:17px">${f.name}</b>${f.demo?'<span class="demo">DEMONSTRAÇÃO</span>':""}</div><div class="mu">${f.producer} · ${f.city}</div><div class="mu">${f.cows} vacas · ${f.milking} em lactação</div><div style="margin-top:6px">${f.st.some(s=>s=="cr")?'<span class="badge cr">Requer atenção</span>':'<span class="badge ok">Em dia</span>'}</div></div>`).join("")+'<button class="btn" onclick="go(\'new\')">+ Cadastrar fazenda</button>'}
function farm(){const f=F();return`<div class="top"><button class="btn s" onclick="go('home')">← Fazendas</button>${f.demo?'<span class="demo">DEMONSTRAÇÃO</span>':""}</div>`+head(f.name,f.producer+" · "+f.city)+qsum()+csum()+msum()+"<h2>Alertas</h2>"+(f.alerts.length?f.alerts.map(a=>`<div class="alert ${a[0]}" style="border-color:currentColor"><span style="color:var(--tx)">${a[1]}</span></div>`).join(""):'<p class="mu">Nenhum alerta.</p>')+"<h2>Central da Fazenda</h2><div class=\"grid\">"+SECT.map((s,i)=>`<div class="sec" onclick="go('sector','${f.id}',${i})"><span class="ic">${s[0]}</span><b>${i+1}. ${s[1]}</b><span class="badge ${stx(f,i)}" style="width:fit-content">${ST[stx(f,i)]}</span></div>`).join("")+"</div>"}
function kpiv(){const f=F();return head("Indicadores",f.name)+kpis(f)+qsum()+csum()+msum()+`<div class="card"><b>CCS – 14 dias</b>${line(f.ccs,"var(--cr)",f.goalCcs)}</div><div class="card"><b>CBT – 14 dias</b>${line(f.cbt,"var(--wa)")}</div><div class="card"><b>Produção diária (L)</b>${bars(f.prod,"var(--pr)")}</div>`+(f.demo?'<p class="mu">Valores fictícios gerados para demonstração.</p>':"")}
function sector(o){if(V.s==5&&!o)return ord();if(V.s==4)return qual();if(V.s==6)return cip();if(V.s==7)return man();const f=F(),s=SECT[V.s],st=f.st[V.s]||"na";let x=`<button class="btn s" onclick="go('farm','${f.id}')">← ${f.name}</button>`+head(s[0]+" "+s[1],s[2])+`<div class="card"><span class="badge ${st}">${ST[st]}</span><p class="mu" style="margin-top:8px">Este módulo está planejado para a próxima etapa. Itens previstos:</p><ul>${s[3].map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
if(V.s==2)x+='<div class="banner">Sem referência técnica verificada cadastrada: toda medição será classificada como “Não avaliado” até você informar limites oficiais.</div>';
if(V.s==5)x+=`<div class="card"><b>Calculadoras (funcionam de verdade)</b>
<label>Litros produzidos</label><input id="c1" type="number" value="${f.prod.length?f.prod[0]:0}" oninput="calc()"><label>Vacas ordenhadas</label><input id="c2" type="number" value="${f.milking}" oninput="calc()"><label>Duração da ordenha (min)</label><input id="c3" type="number" value="${f.hours*60}" oninput="calc()">
<p>Litros/vaca: <span class="res" id="r1"></span></p><p>Litros/hora: <span class="res" id="r2"></span></p>
<label>Pulsação: fases A, B, C, D (ms)</label><div class="grid"><input id="pa" type="number" value="300" oninput="calc()"><input id="pb" type="number" value="150" oninput="calc()"><input id="pc" type="number" value="450" oninput="calc()"><input id="pd" type="number" value="100" oninput="calc()"></div><p>Relação de pulsação: <span class="res" id="r3"></span> <span class="mu">(valor de referência: não avaliado)</span></p></div>`;
return x+(f.demo?'<p class="mu">Dados de demonstração.</p>':"")}
function calc(){if(!$("c1"))return;const g=i=>+$(i).value||0,L=g("c1"),v=g("c2"),m=g("c3");$("r1").textContent=v?(L/v).toFixed(2)+" L":"—";$("r2").textContent=m?(L/m*60).toFixed(0)+" L/h":"—";const a=g("pa"),b=g("pb"),t=a+b+g("pc")+g("pd");$("r3").textContent=t?((a+b)/t*100).toFixed(1)+" %":"—"}
function go(v,f,s){if(v!=V.v)V.note=null;V.v=v;if(f)V.f=f;if(s!=null)V.s=s;render();scrollTo(0,0)}
function render(){const m={home,farm,kpi:kpiv,sector,visit,new:newf,backup:bkv};$("app").innerHTML=statusBar()+m[V.v]();
const t=V.v=="sector"?"farm":V.v,N=[["home","🏠","Fazendas"],["farm","🧩","Central"],["kpi","📊","Indicadores"],["backup","💾","Dados"]];
$("nav").innerHTML=N.map(n=>`<button class="${t==n[0]?"on":""}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("")+`<button class="fab" onclick="go('visit')"><span>＋</span>Visita</button>`;if(V.v=="sector"&&V.s==5){calc();tickT()}drSoon()}
/* ===== Setor 6: Otimização da ordenha ===== */
let STORE_OK=false;
let CORRUPT=null;let SV={ok:null,ts:null,err:null,len:0,pend:false};
function ldS(){try{localStorage.setItem("mq_t","1");localStorage.removeItem("mq_t");STORE_OK=true}catch(e){STORE_OK=false;return{sessions:[],drafts:{}}}
let raw=null;try{raw=localStorage.getItem("mq_ord")}catch(e){STORE_OK=false;return{sessions:[],drafts:{}}}
if(raw){try{const o=JSON.parse(raw);if(!o||typeof o!="object"||Array.isArray(o))throw Error("fmt");o.sessions=Array.isArray(o.sessions)?o.sessions:[];o.drafts=o.drafts&&typeof o.drafts=="object"?o.drafts:{};return o}catch(e){CORRUPT=raw;return{sessions:[],drafts:{}}}}
return{sessions:[],drafts:{}}}
function svS(){if(CORRUPT!==null){SV.ok=false;SV.err="dados ilegíveis protegidos";return false}if(!STORE_OK){SV.ok=false;SV.err="armazenamento indisponível";return false}
try{const s=JSON.stringify(DB);localStorage.setItem("mq_ord",s);if(localStorage.getItem("mq_ord")!==s)throw Error("conferência falhou");SV.ok=true;SV.err=null;SV.ts=Date.now();SV.len=s.length;return true}catch(e){SV.ok=false;SV.err=(e&&e.name=="QuotaExceededError")?"espaço cheio":String(e&&e.message||e).slice(0,60);return false}}
let DB=ldS();
const E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=s=>{if(s==null||isNaN(s))return"—";s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const fm=(v,d)=>v==null||isNaN(v)?"—":v.toLocaleString("pt-BR",{maximumFractionDigits:d});
const MK=[["jatos","Primeiros jatos"],["pre","Pré-dipping"],["sec","Secagem"],["est","Estímulo"],["col","Colocação"],["fim","Fim do fluxo"],["ret","Retirada"]];
const EMP='<div class="card mu">Nenhum teste nesta fazenda ainda. Salve um teste na aba Cronômetro.</div>';
function mkDemo(){const o=[],M=["Ordenhador A","Ordenhador B","Ordenhador C"];[["modelo",0],["critica",1]].forEach(([fid,b])=>{let r=b?7:3;const q=()=>(r=(r*9301+49297)%233280)/233280;for(let i=0;i<9;i++){const cows=[];for(let c=0;c<5;c++){const m={},miss=b&&q()<.4;m.jatos=q()*4;if(!miss){m.pre=m.jatos+6;m.sec=m.pre+(b?10+q()*10:30+q()*10)}m.est=(m.sec||m.jatos+8)+6;m.col=m.est+(b?25+q()*30:8+q()*8);m.ret=m.col+(b?420:300)+q()*60;m.fim=m.ret-(b?60+q()*90:5+q()*15);Object.keys(m).forEach(k=>m[k]=+m[k].toFixed(1));cows.push({n:"D"+(c+1),m})}
o.push({id:"d"+fid+i,fid,demo:true,date:new Date(Date.now()-(8-i)*864e5).toISOString().slice(0,10),turn:i%3+1,milker:M[(i+Math.floor(i/3))%3],lot:i%2?"Lote 2":"Lote 1",litros:Math.round(b?900+q()*200:3100+q()*400),vacas:b?75:160,dur:b?150:135,drops:Math.floor(b?2+q()*4:q()*2),rec:Math.floor(b?1+q()*4:q()*2),occ:b&&i==4?"Conjunto caiu 3x no fim da fila (demo)":"",cows})}});return o}
const DEMO=mkDemo();
const SS=()=>[...DEMO.filter(s=>s.fid==V.f),...DB.sessions.filter(s=>s.fid==V.f)].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const dr=()=>DB.drafts[V.f]||(DB.drafts[V.f]={date:new Date().toISOString().slice(0,10),turn:1,milker:"",lot:"",litros:"",vacas:"",dur:"",drops:0,rec:0,occ:"",cows:[]});
const cd=c=>{const m=c.m,p=[m.jatos,m.pre,m.sec,m.est].filter(x=>x!=null),f=p.length?Math.min(...p):null;return{pa:f!=null&&m.col!=null?m.col-f:null,ct:m.pre!=null&&m.sec!=null?m.sec-m.pre:null,or:m.col!=null&&m.ret!=null?m.ret-m.col:null,so:m.fim!=null&&m.ret!=null?Math.max(0,m.ret-m.fim):null,full:["jatos","pre","sec","est","col","ret"].every(k=>m[k]!=null),hyg:m.pre!=null&&m.sec!=null}};
function agg(ss){const a=f=>{const v=ss.map(f).filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((x,y)=>x+y,0)/v.length:null},cs=ss.flatMap(s=>s.cows.map(cd)),b=k=>{const v=cs.map(c=>c[k]).filter(x=>x!=null);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null};return{n:ss.length,nc:cs.length,lv:a(s=>s.vacas&&s.litros?s.litros/s.vacas:null),lh:a(s=>s.dur&&s.litros?s.litros/s.dur*60:null),pa:b("pa"),ct:b("ct"),or:b("or"),so:b("so"),dr:a(s=>s.drops),rc:a(s=>s.rec)}}
function rank(ss){const by={};ss.forEach(s=>(by[s.milker]=by[s.milker]||[]).push(s));const R=Object.entries(by).map(([n,l])=>{const a=agg(l),cs=l.flatMap(s=>s.cows.map(cd));return{n,a,nc:cs.length,rot:cs.length?cs.filter(c=>c.full).length/cs.length*100:null,hig:cs.length?cs.filter(c=>c.hyg).length/cs.length*100:null,lots:[...new Set(l.map(s=>s.lot||"—"))],tn:[...new Set(l.map(s=>s.turn))]}});const mx=Math.max(0,...R.map(r=>r.a.lh||0));R.forEach(r=>{r.ef=r.a.lh!=null&&mx?r.a.lh/mx*100:null;const v=[r.ef,r.rot,r.hig].filter(x=>x!=null);r.sc=v.length?v.reduce((x,y)=>x+y,0)/v.length:null});return R.sort((x,y)=>(y.sc==null?-1:y.sc)-(x.sc==null?-1:x.sc))}
/* cronômetro */
const T={run:false,acc:0,t0:0,m:{},done:false,n:""};
const el=()=>T.acc+(T.run?(Date.now()-T.t0)/1000:0);
function tickT(){const e=$("tm");if(e)e.textContent=mmss(el())}
setInterval(tickT,250);
function tstart(){if(T.done||T.run)return;T.run=true;T.t0=Date.now();render()}
function tpause(){if(!T.run)return;T.acc=el();T.run=false;render()}
function tfin(){if(!T.run&&T.acc==0)return;T.acc=el();T.run=false;T.done=true;render()}

 c.meta.imports=(arr1(c.meta.imports).concat([{at:new Date().toISOString(),file:R.name,mode,added,replaced:repl,removed:dropped}])).slice(-20);return{c,added,repl,dropped}}
function snapWrite(){try{const s=JSON.stringify({ts:Date.now(),db:DB});localStorage.setItem("mq_snap",s);return localStorage.getItem("mq_snap")===s}catch(e){return false}}
function snapInfo(){try{const o=JSON.parse(localStorage.getItem("mq_snap")||"null");return o&&o.ts?o.ts:null}catch(e){return null}}
function bkApply(){const R=BK.rep,mode=BK.mode;if(!R||!R.ok)return;
 if(mode!="add"&&BK.armed!=mode){BK.armed=mode;return render()}
 if(mode=="full"&&String(BK.typed).trim().toUpperCase()!=="RESTAURAR")return note("Digite RESTAURAR para confirmar a restauração total.");
 if(!STORE_OK)return note("Armazenamento indisponível: a importação foi bloqueada.");
 const snap=snapWrite();if(!snap&&mode!="add"&&!BK.nosnap){BK.needNoSnap=true;return note("Sem espaço para a cópia de segurança interna. Exporte um backup atual e marque a opção de prosseguir sem cópia, ou use o modo “adicionar só o novo”.")}
 const b=bkBuild(R,mode,BK.inc);
 try{const s=JSON.stringify(b.c);localStorage.setItem("mq_ord",s);if(localStorage.getItem("mq_ord")!==s)throw Error("verificação")}catch(e){return note(FAIL+" Nada foi alterado.")}
 DB=b.c;farms=farms.filter(f=>f.demo).concat(DB.farms);SV.ok=true;SV.err=null;SV.ts=Date.now();SV.len=JSON.stringify(DB).length;
 BK.rep=null;BK.armed=null;BK.typed="";BK.needNoSnap=false;note("Importação concluída e verificada: "+b.added+" adicionados, "+b.repl+" substituídos"+(b.dropped?", "+b.dropped+" removidos":"")+"."+(snap?" Cópia anterior guardada para desfazer.":""),1)}
function bkUndo(){if(BK.armed!="undo"){BK.armed="undo";return render()}let o=null;try{o=JSON.parse(localStorage.getItem("mq_snap")||"null")}catch(e){}if(!o||!o.db)return note("Não há cópia interna válida.");
 try{const d=migrate(o.db),s=JSON.stringify(d);localStorage.setItem("mq_ord",s);if(localStorage.getItem("mq_ord")!==s)throw Error("verificação");DB=d}catch(e){return note(FAIL+" Nada foi alterado.")}
 farms=farms.filter(f=>f.demo).concat(DB.farms);BK.armed=null;SV.ok=true;SV.err=null;note("Estado anterior à última importação restaurado.",1)}
function bkProbe(){let best=0;try{for(const n of[256e3,512e3,1e6,2e6,3e6,4e6,5e6,6e6,8e6]){try{localStorage.setItem("mq_probe","x".repeat(n));best=n}catch(e){break}}}finally{try{localStorage.removeItem("mq_probe")}catch(e){}}BK.probe=best;render()}
function usage(){let n=0;["mq_ord","mq_draft","mq_snap","mq_pre_v2","mq_user"].forEach(k=>{try{n+=(localStorage.getItem(k)||"").length}catch(e){}});return n}
function bkStats(R){const rows=ARR.concat(MAP).filter(k=>R.stats[k].n||R.sstats[k].n),T=(o,k)=>sumOf(ARR.concat(MAP).map(x=>o[x][k]));
 return`<div class="ov"><table><tr><th>Dados</th><th>Arq.</th><th>Novos</th><th>Iguais</th><th>Diferentes</th></tr>${rows.map(k=>`<tr><td>${LAB[k]}</td><td>${R.stats[k].n}${R.sstats[k].n?` <span class="mu">(+${R.sstats[k].n} teste)</span>`:""}</td><td>${R.stats[k].add}</td><td>${R.stats[k].same}</td><td>${R.stats[k].conf}</td></tr>`).join("")}</table></div><p class="mu">“Diferentes” são itens com o mesmo id, mas conteúdo diferente do que você tem hoje. Registros de teste (feitos em fazendas de demonstração): ${T(R.sstats,"n")}.</p>`}
function bkv(){const b=buildBody(),cr=sumOf(cntOf(b.real)),cs=sumOf(cntOf(b.sandbox)),u=usage(),sn=snapInfo(),R=BK.rep,m=DB.meta||{};
 let opt="";if(R&&R.ok){const conf=sumOf(ARR.concat(MAP).map(k=>R.stats[k].conf+(BK.inc?R.sstats[k].conf:0))),mode=BK.mode,dry=BK.armed==mode&&mode!="add"?bkBuild(R,mode,BK.inc):null;
  opt=`<h2>Como importar</h2><label><input type="radio" style="width:auto" name="bm" ${mode=="add"?"checked":""} onchange="BK.mode='add';BK.armed=null;render()"> <b>Adicionar só o que ainda não existe</b> (padrão). Não altera nada que você já tem; diferentes ficam como estão.</label><br><label><input type="radio" style="width:auto" name="bm" ${mode=="replace"?"checked":""} onchange="BK.mode='replace';BK.armed=null;render()"> Também substituir os ${conf} item(ns) diferentes pelos do arquivo (pede confirmação)</label><br><label><input type="radio" style="width:auto" name="bm" ${mode=="full"?"checked":""} onchange="BK.mode='full';BK.armed=null;render()"> Restaurar tudo: ficar com exatamente os dados reais do arquivo (pede confirmação)</label><br><label><input type="checkbox" style="width:auto" ${BK.inc?"checked":""} onchange="BK.inc=this.checked;BK.armed=null;render()"> Incluir registros de teste (fazendas de demonstração)</label>`+
  (dry?`<div class="alert wa" style="border-color:currentColor"><span style="color:var(--tx)"><b>Confirme:</b> serão adicionados ${dry.added}, substituídos ${dry.repl}${dry.dropped?` e <b>removidos ${dry.dropped}</b> itens que existem hoje e não estão no arquivo`:""}. Uma cópia interna do estado atual é guardada para poder desfazer${BK.needNoSnap?" (sem espaço agora)":""}.</span></div>${mode=="full"?`<label>Digite RESTAURAR para confirmar</label><input value="${E(BK.typed)}" oninput="BK.typed=this.value">`:""}${BK.needNoSnap?`<label><input type="checkbox" style="width:auto" ${BK.nosnap?"checked":""} onchange="BK.nosnap=this.checked"> Já exportei um backup atual e aceito prosseguir sem cópia interna</label>`:""}`:"")+
  `<br><br><button class="btn" onclick="bkApply()">${mode=="add"?"Importar (adicionar novos)":BK.armed==mode?"Confirmar e aplicar":"Continuar…"}</button>`+(BK.armed&&BK.armed!="undo"&&BK.armed!="fresh"?`<br><br><button class="btn s" onclick="BK.armed=null;render()">Cancelar</button>`:"")}
 const rep=R?`<div class="card"><b>Verificação — ${E(R.name)}</b>${R.checks.map(c=>`<p class="ok">✔ ${E(c)}</p>`).join("")}${R.errors.map(c=>`<p class="cr">✖ ${E(c)}</p>`).join("")}${R.warns.map(c=>`<p class="wa">⚠ ${E(c)}</p>`).join("")}${R.ok?bkStats(R)+opt:'<p class="mu">Importação bloqueada: nenhum dado foi alterado.</p>'}</div>`:"";
 return head("💾 Dados e backup","Versão dos dados v"+(m.ver||"—"))+`<div class="banner"><b>Limites do armazenamento:</b> os dados ficam só neste navegador e neste aparelho (localStorage). O espaço é pequeno (típico ~5 MB por site, varia) e fotos o consomem rápido. Limpar os dados do site, usar modo privado ou trocar de navegador/aparelho perde ou esconde os dados. Não há sincronização. Faça backup com frequência.</div>
<div class="card"><b>Estado</b><p class="mu">Versão dos dados: v${m.ver||"—"} · app ${APP_BUILD}<br>Última gravação: ${SV.ts?hhmm(SV.ts)+(SV.ok===false?" (FALHOU)":" (verificada)"):"nenhuma nesta sessão"}<br>Último backup gerado: ${m.lastExport?new Date(m.lastExport).toLocaleString("pt-BR"):"nunca"}<br>Registros reais: ${cr} · registros de teste em fazendas demo: ${cs}<br>Uso estimado: ${fm(u/1e6,2)} milhões de caracteres (limite típico ~5 milhões)</p><button class="btn s" onclick="bkProbe()">Testar espaço livre</button>${BK.probe!=null?`<p class="mu">Espaço livre aproximado: ${BK.probe>=8e6?"mais de 8 milhões":"cerca de "+fm(BK.probe/1e6,1)+" milhões"} de caracteres.</p>`:""}</div>
<div class="card"><b>Exportar backup</b><p class="mu">Gera um arquivo .json com todos os dados reais, os registros de teste (em seção separada), a versão dos dados e uma assinatura de integridade. Dados de demonstração nunca entram.</p><button class="btn" onclick="bkExport()">Gerar backup (.json)</button>${BK.last?`<p class="mu">Último gerado: ${E(BK.last.name)} · ${fm(BK.last.size/1e3,0)} mil caracteres · ${BK.last.n} registros reais · assinatura ${BK.last.algo} ${BK.last.ck}</p>`:""}${BK.fallback?'<br><br><button class="btn s" onclick="bkCopy()">Copiar texto do backup</button>':""}${BK.text?`<textarea rows="6" readonly onclick="this.select()">${E(BK.text)}</textarea>`:""}</div>
<div class="card"><b>Importar backup</b><p class="mu">O arquivo é verificado antes (formato, integridade, versão e estrutura). Nada é alterado até você escolher como importar e confirmar.</p><input type="file" accept=".json,application/json" onchange="bkPick(this)"><label>Ou cole o texto do backup</label><textarea id="bkpaste" rows="3"></textarea><button class="btn s" onclick="bkPaste()">Verificar texto colado</button></div>${rep}
<div class="card"><b>Desfazer última importação</b><p class="mu">${sn?"Cópia interna de "+new Date(sn).toLocaleString("pt-BR")+". Restaurá-la apaga o que foi registrado depois dela.":"Não há cópia interna."}</p>${sn?`<button class="btn s" onclick="bkUndo()">${BK.armed=="undo"?"Confirmar restauração":"Restaurar estado anterior"}</button>`:""}</div>`+(m.imports&&m.imports.length?`<div class="card"><b>Importações recentes</b>${m.imports.slice(-3).reverse().map(i=>`<p class="mu">${new Date(i.at).toLocaleString("pt-BR")} · ${E(i.file)} · ${i.mode} · +${i.added} / ~${i.replaced} / −${i.removed}</p>`).join("")}</div>`:"")}
/* instalação dos ganchos e partida */
if(typeof window!="undefined"&&window.addEventListener){window.addEventListener("pagehide",flushAll);window.addEventListener("beforeunload",e=>{if(SV.pend||DRP||SV.ok===false){e.preventDefault();e.returnValue=""}});if(document.addEventListener){document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="hidden")flushAll()});document.addEventListener("input",drSoon);document.addEventListener("change",drSoon)}}
initData();drRestore();

render();
</script></body></html>
